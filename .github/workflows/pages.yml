name: Publish Datsu archive

on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  check-comic-release:
    if: github.event_name != 'release' || github.event.release.tag_name == 'hq-torneio-v1' || github.event.release.tag_name == 'hq-torneio-v2'
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.release.outputs.available }}
    steps:
      - name: Check comic media release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in hq-torneio-v1 hq-torneio-v2; do
            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=Release ausente::A publicação aguarda a release $tag."
              exit 0
            fi
          done
          echo "available=true" >> "$GITHUB_OUTPUT"

  build:
    needs: check-comic-release
    if: needs.check-comic-release.outputs.available == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download comic media from GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          media_root="$RUNNER_TEMP/datsu-comic-media"
          mkdir -p "$media_root/v1" "$media_root/v2"
          gh release download hq-torneio-v1 --repo "$GITHUB_REPOSITORY" --dir "$media_root/v1"
          gh release download hq-torneio-v2 --repo "$GITHUB_REPOSITORY" --dir "$media_root/v2"

          volume1="public/content/comics/torneio-infernal-aurora-vs-drekalia-1"
          mkdir -p "$volume1/audio"
          cp "$media_root/v1/HQ.-.Torneio.Infernal.-.Aurora.vs.Drekalia.V.1.pdf" "$volume1/comic.pdf"
          cp "$media_root/v1/Capa.png" "$volume1/cover.png"
          cp "$media_root/v1/Isaac.mp3" "$volume1/audio/isaac.mp3"
          cp "$media_root/v1/Torneio.mp3" "$volume1/audio/torneio.mp3"
          cp "$media_root/v1/Kurogane.mp3" "$volume1/audio/kurogane.mp3"
          cp "$media_root/v1/Drekai.1.mp3" "$volume1/audio/drekai-1.mp3"
          cp "$media_root/v1/Drekai.2.mp3" "$volume1/audio/drekai-2.mp3"
          cp "$media_root/v1/Men.khir.mp3" "$volume1/audio/menkhir.mp3"

          volume2="public/content/comics/torneio-infernal-aurora-vs-drekalia-2"
          mkdir -p "$volume2/audio"
          cp "$media_root/v2/volume2-comic.pdf" "$volume2/comic.pdf"
          cp "$media_root/v2/sociedade.mp3" "$volume2/audio/sociedade.mp3"
          cp "$media_root/v2/suspense-1.mp3" "$volume2/audio/suspense-1.mp3"
          cp "$media_root/v2/suspense-2.mp3" "$volume2/audio/suspense-2.mp3"
          cp "$media_root/v2/exploracao-1.mp3" "$volume2/audio/exploracao-1.mp3"
          cp "$media_root/v2/combate-1.mp3" "$volume2/audio/combate-1.mp3"
          cp "$media_root/v2/heroismo.mp3" "$volume2/audio/heroismo.mp3"
          cp "$media_root/v2/coracao.mp3" "$volume2/audio/coracao.mp3"
          cp "$media_root/v2/combate-2.mp3" "$volume2/audio/combate-2.mp3"
      - name: Run tests
        run: npm test
      - name: Run lint
        run: npm run lint
      - name: Build static site
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4